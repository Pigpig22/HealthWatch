name: 功能建议
description: 提议新的能力或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你遇到了什么问题，谁会使用这个功能？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 希望 HealthWatch 如何解决？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 是否考虑过其他做法？
  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围
      options:
        - label: 移动端界面
        - label: BLE 协议或 ESP32
        - label: 数据存储或导出
        - label: 权限或隐私
